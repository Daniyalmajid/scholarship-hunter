<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scholarship Hunter | Daniyal Majeed</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen">
  <header class="max-w-6xl mx-auto px-4 pt-10 pb-6">
    <h1 class="text-3xl sm:text-4xl font-bold tracking-tight text-white">Scholarship Hunter</h1>
    <p class="mt-2 text-slate-400 max-w-2xl">Funded opportunities matched to a Chemical Engineering undergraduate from Pakistan. Refreshed daily at 06:00 UTC.</p>
  </header>

  <main class="max-w-6xl mx-auto px-4 pb-16">
    <section class="grid grid-cols-2 lg:grid-cols-4 gap-3" aria-label="Summary">
      <div class="stat"><p class="stat-n" id="s-total">0</p><p class="stat-l">Total matches</p></div>
      <div class="stat"><p class="stat-n text-amber-400" id="s-soon">0</p><p class="stat-l">Closing within 30 days</p></div>
      <div class="stat"><p class="stat-n text-emerald-400" id="s-full">0</p><p class="stat-l">Fully funded</p></div>
      <div class="stat"><p class="stat-n text-sky-400" id="s-applied">0</p><p class="stat-l">Marked applied</p></div>
    </section>

    <section class="mt-6 grid gap-3 sm:grid-cols-2 lg:grid-cols-6" aria-label="Filters">
      <input id="q" type="search" placeholder="Search title, country, organisation..." class="field lg:col-span-2" aria-label="Search">
      <select id="f-country" class="field" aria-label="Country"><option value="">All countries</option></select>
      <select id="f-level" class="field" aria-label="Degree level"><option value="">All levels</option></select>
      <select id="f-funding" class="field" aria-label="Funding type"><option value="">All funding</option></select>
      <select id="f-view" class="field" aria-label="View">
        <option value="">All</option><option value="saved">Saved</option>
        <option value="applied">Applied</option><option value="todo">Not applied</option>
      </select>
    </section>

    <p id="count" class="mt-5 text-sm text-slate-500"></p>
    <section id="grid" class="mt-3 grid gap-4 md:grid-cols-2" aria-live="polite"></section>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
